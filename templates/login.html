{% extends "base.html" %}
{% block title %}Sign In — Inventory Manager{% endblock %}
{% block content %}
<div class="login-card">
  <h1>Inventory Manager</h1>
  <p class="login-subtitle">Sign in to manage your warehouse</p>

  {% if error %}
  <div class="alert alert-error">{{ error }}</div>
  {% endif %}

  <form method="post" action="/auth/login">
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" class="form-input" placeholder="you@example.com" required autofocus>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" class="form-input" placeholder="Your password" required>
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Sign in</button>
  </form>

  <div class="login-demo-hint">
    <strong>Demo:</strong> cenius@cenius.ai / cenius
  </div>
</div>
{% endblock %}
