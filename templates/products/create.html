{% extends "base.html" %}
{% block title %}New Product — Inventory Manager{% endblock %}
{% block content %}
<div class="page-header">
  <h1>New Product</h1>
  <p>Add a new product to the inventory</p>
</div>

{% if errors %}
{% for err in errors %}
<div class="alert alert-error">{{ err }}</div>
{% endfor %}
{% endif %}

<div class="card">
  <form method="post" action="/products/create">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
      <div class="form-group">
        <label for="sku">SKU *</label>
        <input type="text" id="sku" name="sku" class="form-input" value="{{ sku or '' }}" placeholder="e.g. ELEC-001" required autofocus>
      </div>
      <div class="form-group">
        <label for="name">Name *</label>
        <input type="text" id="name" name="name" class="form-input" value="{{ name or '' }}" placeholder="Product name" required>
      </div>
    </div>
    <div class="form-group">
      <label for="description">Description</label>
      <textarea id="description" name="description" class="form-input" placeholder="Brief description">{{ description or '' }}</textarea>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:16px;">
      <div class="form-group">
        <label for="category_id">Category *</label>
        <select id="category_id" name="category_id" class="form-input" required>
          <option value="">Select…</option>
          {% for cat in categories %}
          <option value="{{ cat.id }}" {% if category_id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label for="current_stock">Initial Stock</label>
        <input type="number" id="current_stock" name="current_stock" class="form-input" value="{{ current_stock if current_stock is defined else 0 }}" min="0">
      </div>
      <div class="form-group">
        <label for="reorder_point">Reorder Point</label>
        <input type="number" id="reorder_point" name="reorder_point" class="form-input" value="{{ reorder_point if reorder_point is defined else 10 }}" min="0">
      </div>
      <div class="form-group">
        <label for="unit">Unit</label>
        <input type="text" id="unit" name="unit" class="form-input" value="{{ unit or 'pcs' }}" placeholder="pcs, kg, box…">
      </div>
    </div>
    <div style="display:flex;gap:8px;">
      <button type="submit" class="btn btn-primary">Create Product</button>
      <a href="/products/" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
