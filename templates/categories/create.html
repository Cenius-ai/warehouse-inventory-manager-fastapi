{% extends "base.html" %}
{% block title %}New Category — Inventory Manager{% endblock %}
{% block content %}
<div class="page-header">
  <h1>New Category</h1>
  <p>Add a product category to the system</p>
</div>

{% if error %}
<div class="alert alert-error">{{ error }}</div>
{% endif %}

<div class="card">
  <form method="post" action="/categories/create">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="form-group">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" class="form-input" value="{{ name or '' }}" placeholder="e.g. Electronics" required autofocus>
    </div>
    <div class="form-group">
      <label for="description">Description</label>
      <textarea id="description" name="description" class="form-input" placeholder="Brief description of this category">{{ description or '' }}</textarea>
    </div>
    <div style="display:flex;gap:8px;">
      <button type="submit" class="btn btn-primary">Create Category</button>
      <a href="/categories/" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
